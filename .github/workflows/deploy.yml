# =============================================================
# Self-Healing Deployment Pipeline — CI/CD Workflow
#
# Triggered on every push to main.
#
# What this workflow does (in order):
#   1. Check out source code
#   2. Set up Java 21 and Maven cache
#   3. Build and run all tests with mvn clean verify
#   4. Build demo-app Docker image tagged with the Git commit SHA
#   5. Push the image to GitHub Container Registry (GHCR)
#   6. Write a kubeconfig from the KUBECONFIG_B64 secret
#   7. Apply all Kubernetes manifests (k8s/)
#   8. Update demo-app Deployment to use the new image tag
#   9. Wait for the rollout to succeed (5-minute timeout)
#  10. If the rollout fails, automatically roll back to the previous revision
#
# Required GitHub Repository Secrets:
#   GHCR_TOKEN   — GitHub token with packages:write scope
#                  (Settings → Developer settings → Personal access tokens → Fine-grained)
#   KUBECONFIG_B64 — Base64-encoded kubeconfig for your local cluster
#                    Generate: [System.Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\.kube\config"))
#
# The GITHUB_ACTOR variable is the username of the person who triggered the
# workflow — used as the GHCR registry username.
# =============================================================

name: Build, Test, and Deploy

on:
  push:
    branches:
      - main
  # Allow manual trigger from the GitHub Actions UI (useful for debugging)
  workflow_dispatch:

# Permissions needed for:
#   packages: write   → push Docker image to GHCR
#   contents: read    → check out the repository
permissions:
  packages: write
  contents: read

env:
  # The GHCR registry URL — always ghcr.io for GitHub Container Registry
  REGISTRY: ghcr.io
  # Image name: ghcr.io/<owner>/demo-app
  # github.repository returns "owner/repo-name"
  IMAGE_NAME: ${{ github.repository }}/demo-app
  # Kubernetes namespace (must match k8s/namespace.yaml)
  KUBE_NAMESPACE: demo
  # Deployment name (must match k8s/demo-app-deployment.yaml)
  DEPLOYMENT_NAME: demo-app

jobs:

  # ===========================================================================
  # Job 1: Build and Test
  # Compiles the code and runs all unit tests.
  # Only proceeds to deployment if this passes.
  # ===========================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java 21
      # The cache: 'maven' option caches ~/.m2/repository between runs,
      # which dramatically speeds up subsequent builds.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Build and test with Maven
      # 'clean verify' runs: clean → compile → test → package → verify
      # If any test fails, the step fails and the workflow stops here.
      # -B = batch mode (no interactive prompts, cleaner CI output)
      - name: Build and run tests
        run: mvn -B clean verify
        working-directory: demo-app

      # Step 4: Build and test healing-agent too
      - name: Build and run healing-agent tests
        run: mvn -B clean verify
        working-directory: healing-agent

      # Step 5: Upload JARs as workflow artifacts
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            demo-app/target/demo-app-*.jar
            healing-agent/target/healing-agent-*.jar
          retention-days: 7

  # ===========================================================================
  # Job 2a: Build and push demo-app Docker image to GHCR
  # ===========================================================================
  build-and-push:
    name: Build and Push demo-app Image
    runs-on: ubuntu-latest
    needs: build-and-test

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      short-sha: ${{ steps.short-sha.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: short-sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (demo-app)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push demo-app Docker image
        uses: docker/build-push-action@v5
        with:
          context: demo-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Job 2b: Build and push healing-agent Docker image to GHCR
  # ===========================================================================
  build-and-push-healing-agent:
    name: Build and Push healing-agent Image
    runs-on: ubuntu-latest
    needs: build-and-test

    outputs:
      short-sha: ${{ steps.short-sha.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: short-sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (healing-agent)
        id: meta-ha
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/healing-agent
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push healing-agent Docker image
        uses: docker/build-push-action@v5
        with:
          context: healing-agent
          push: true
          tags: ${{ steps.meta-ha.outputs.tags }}
          labels: ${{ steps.meta-ha.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Job 3: Deploy to Kubernetes
  # Only runs if both image builds succeed.
  # ===========================================================================
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-healing-agent]

    # Environment for GitHub's deployment tracking
    environment:
      name: local-cluster
      url: http://localhost:8080  # Port-forward URL for local clusters

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step: Write kubeconfig from the GitHub Secret.
      # KUBECONFIG_B64 contains a base64-encoded kubeconfig file.
      # We decode it to a file and point KUBECONFIG at that file.
      #
      # To generate this secret on Windows (PowerShell):
      #   [System.Convert]::ToBase64String(
      #     [IO.File]::ReadAllBytes("$env:USERPROFILE\.kube\config")
      #   )
      # Then add the output as a GitHub Secret named KUBECONFIG_B64.
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # Step: Verify kubectl can reach the cluster before attempting deployment.
      # If this fails, it means the kubeconfig is wrong or the cluster is unreachable
      # from the Actions runner (expected for local clusters — see note below).
      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # Step: Apply all Kubernetes manifests.
      - name: Apply Kubernetes manifests
        run: |
          echo "Applying namespace..."
          kubectl apply -f k8s/namespace.yaml

          echo "Applying RBAC for healing-agent..."
          kubectl apply -f k8s/healing-agent-rbac.yaml

          echo "Applying all manifests..."
          kubectl apply -f k8s/

          echo "Waiting for namespace to be active..."
          kubectl wait --for=jsonpath='{.status.phase}'=Active \
            namespace/demo --timeout=30s

      # Step: Update the demo-app Deployment to use the new image.
      - name: Update demo-app image
        run: |
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.short-sha }}"
          echo "Deploying demo-app image: $NEW_IMAGE"

          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            ${{ env.DEPLOYMENT_NAME }}=$NEW_IMAGE \
            -n ${{ env.KUBE_NAMESPACE }}

          kubectl annotate deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.KUBE_NAMESPACE }} \
            kubernetes.io/change-cause="Deploy commit ${{ github.sha }}" \
            --overwrite

      # Step: Update the healing-agent Deployment image.
      - name: Update healing-agent image
        run: |
          HA_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/healing-agent:${{ needs.build-and-push.outputs.short-sha }}"
          echo "Deploying healing-agent image: $HA_IMAGE"

          kubectl set image deployment/healing-agent \
            healing-agent=$HA_IMAGE \
            -n ${{ env.KUBE_NAMESPACE }} || echo "healing-agent deployment not found yet — will be created by manifest apply"

      # Step: Wait for the rollout to complete.
      # --timeout=5m means we'll wait up to 5 minutes.
      # If the new pods don't become Ready in 5 minutes, this step fails
      # and the next step (automatic rollback) runs.
      - name: Wait for rollout to complete
        id: rollout-status
        # 'continue-on-error: true' means even if this step fails,
        # the workflow continues to the rollback step below.
        continue-on-error: true
        run: |
          echo "Waiting for rollout to complete (timeout: 5m)..."
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.KUBE_NAMESPACE }} \
            --timeout=5m

      # Step: Automatic rollback if the rollout failed.
      # This runs ONLY if the previous step failed (the rollout timed out
      # or returned an error).
      #
      # IMPORTANT: This is a basic CI/CD safety net.
      # The healing-agent provides the full intelligent rollback flow
      # (with LLM analysis, GitHub issue creation, and cooldown protection).
      # This step exists to catch failures that happen before the healing-agent
      # has had a chance to respond.
      - name: Automatic rollback on failure
        if: steps.rollout-status.outcome == 'failure'
        run: |
          echo "::warning::Rollout failed! Initiating automatic rollback..."

          kubectl rollout undo deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.KUBE_NAMESPACE }}

          echo "Waiting for rollback to complete..."
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.KUBE_NAMESPACE }} \
            --timeout=3m

          echo "::error::Deployment was automatically rolled back. Check the pod logs for details."
          # Exit with failure so the overall workflow is marked as failed
          # (the rollback was a recovery action, not a success)
          exit 1

      # Step: Print deployment summary on success
      - name: Deployment summary
        if: steps.rollout-status.outcome == 'success'
        run: |
          echo "## Deployment Successful 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.short-sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | \`${{ env.KUBE_NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment | \`${{ env.DEPLOYMENT_NAME }}\` |" >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "Current pods:"
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }} -l app=${{ env.DEPLOYMENT_NAME }}

          echo ""
          echo "Rollout history:"
          kubectl rollout history deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.KUBE_NAMESPACE }}
