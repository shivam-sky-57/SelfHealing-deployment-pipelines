# =============================================================
# Alertmanager Service
#
# DNS name inside the cluster:
#   alertmanager.demo.svc.cluster.local:9093
#
# Prometheus uses this address to send fired alerts.
#
# Port-forward to access the Alertmanager UI locally:
#   kubectl port-forward svc/alertmanager -n demo 9093:9093
#   Then open: http://localhost:9093
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: demo
  labels:
    app: alertmanager
    project: self-healing-pipeline
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: http
      protocol: TCP
      port: 9093
      targetPort: http
