# =============================================================
# healing-agent Service
#
# DNS name inside the cluster:
#   healing-agent.demo.svc.cluster.local:8081
#
# Alertmanager is configured to POST to this address.
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: healing-agent
  namespace: demo
  labels:
    app: healing-agent
    project: self-healing-pipeline
spec:
  type: ClusterIP
  selector:
    app: healing-agent
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: http
