# =============================================================
# Prometheus Service
#
# DNS name inside the cluster:
#   prometheus.demo.svc.cluster.local:9090
#
# Port-forward to access the Prometheus UI locally:
#   kubectl port-forward svc/prometheus -n demo 9090:9090
#   Then open: http://localhost:9090
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: demo
  labels:
    app: prometheus
    project: self-healing-pipeline
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: http
