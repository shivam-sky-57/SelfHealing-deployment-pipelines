# =============================================================
# healing-agent — Spring Boot Application Configuration
# =============================================================

server:
  port: 8081

spring:
  application:
    name: healing-agent

# =============================================================
# Actuator — expose health and prometheus for the agent itself
# =============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# =============================================================
# Groq LLM API Configuration
# All values read from environment variables — never hard-coded.
# =============================================================
groq:
  api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:llama3-8b-8192}
  # Maximum tokens for the LLM response
  max-tokens: 1024
  # Temperature (0.0 = deterministic, 1.0 = creative) — low for structured JSON output
  temperature: 0.1

# =============================================================
# GitHub API Configuration
# =============================================================
github:
  token: ${GITHUB_TOKEN:}
  owner: ${GITHUB_OWNER:}
  repo: ${GITHUB_REPO:}
  api-url: https://api.github.com

# =============================================================
# Kubernetes Configuration
# =============================================================
kubernetes:
  namespace: ${KUBE_NAMESPACE:demo}
  deployment-name: ${KUBE_DEPLOYMENT_NAME:demo-app}
  # How many log lines to collect per container per incident
  log-lines: 100

# =============================================================
# Remediation Policy Configuration
# =============================================================
remediation:
  # Cooldown in minutes — prevents rollback thrashing
  cooldown-minutes: ${ROLLBACK_COOLDOWN_MINUTES:5}
  # Time window after a deployment within which a failure is
  # considered "post-deploy" and eligible for rollback
  post-deploy-window-minutes: ${POST_DEPLOY_WINDOW_MINUTES:10}

# =============================================================
# Application info
# =============================================================
info:
  app:
    name: healing-agent
    description: Automated incident-response service for Kubernetes deployments
    version: 1.0.0
